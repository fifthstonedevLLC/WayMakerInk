server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Pretty routes: /nic and /laynie are served by index.html, which reads
    # the path segment and renders the right artist. Keeps one file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        # default_type, not add_header — add_header APPENDS, so setting
        # Content-Type that way emits two of them (the default
        # application/octet-stream plus text/plain).
        default_type text/plain;
        return 200 'ok';
    }

    # index.html must never be cached, or a deploy won't reach returning
    # visitors. Fingerprint-free assets get a short cache instead of a long one.
    #
    # ⚠ The three hardening headers are repeated in every block below, and that
    # is deliberate — do not "de-duplicate" them up to the server level.
    # nginx's add_header inheritance is all-or-nothing: a context that declares
    # any add_header of its own silently discards every one inherited from its
    # parent. Because each of these blocks sets Cache-Control, a server-level
    # copy of the hardening headers would reach no response at all. `always`
    # does not change this — it only controls error responses.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ~* \.(png|jpg|jpeg|svg|ico|webp)$ {
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Anything not matched above (the try_files fallback path).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # n8n webhooks, proxied so every artist- and client-facing link lives on
    # this domain rather than on the n8n host. The artist's decision links were
    # being flagged by a browser blocklist; nothing about n8n moves, this is
    # only a second front door onto the same instance.
    #
    # ⚠ No add_header in this block, deliberately. Per the note above, it
    # inherits the three server-level hardening headers — and declaring even
    # one of its own would silently discard all three.
    #
    # ^~ rather than a bare prefix: regex locations are matched first, so the
    # \.(css|js)$ block above would otherwise win for a webhook path ending
    # in .js.
    location ^~ /webhook/ {
        # Resolved per-request through Docker's embedded DNS rather than once
        # at config load. A literal hostname in proxy_pass makes nginx refuse
        # to START when n8n is unreachable — and since the healthcheck gates
        # the deploy, the booking form would go down because n8n was slow. It
        # would also cache that IP forever, so an n8n restart breaks the proxy
        # silently. This form degrades to a 502 instead, and recovers on its
        # own. proxy_pass with a variable drops the URI, hence $request_uri.
        resolver 127.0.0.11 valid=30s ipv6=off;
        # Bound the wait when DNS itself is unavailable. The default is 30s,
        # which an artist experiences as a link that hangs rather than one
        # that fails.
        resolver_timeout 5s;
        set $n8n http://n8n-automations-n8nrunnerpostgresollama-egxbst-n8n-1:5678;
        proxy_pass $n8n$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # The intake form posts up to 5 client-resized JPEGs as multipart.
        # nginx's 1m default would 413 a normal submission.
        client_max_body_size 25m;
        proxy_request_buffering off;

        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 512;
}
