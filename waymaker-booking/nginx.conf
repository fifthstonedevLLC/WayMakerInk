server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Pretty routes: /nic and /laynie are served by index.html, which reads
    # the path segment and renders the right artist. Keeps one file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        # default_type, not add_header — add_header APPENDS, so setting
        # Content-Type that way emits two of them (the default
        # application/octet-stream plus text/plain).
        default_type text/plain;
        return 200 'ok';
    }

    # index.html must never be cached, or a deploy won't reach returning
    # visitors. Fingerprint-free assets get a short cache instead of a long one.
    #
    # ⚠ The three hardening headers are repeated in every block below, and that
    # is deliberate — do not "de-duplicate" them up to the server level.
    # nginx's add_header inheritance is all-or-nothing: a context that declares
    # any add_header of its own silently discards every one inherited from its
    # parent. Because each of these blocks sets Cache-Control, a server-level
    # copy of the hardening headers would reach no response at all. `always`
    # does not change this — it only controls error responses.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ~* \.(png|jpg|jpeg|svg|ico|webp)$ {
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Anything not matched above (the try_files fallback path).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 512;
}
